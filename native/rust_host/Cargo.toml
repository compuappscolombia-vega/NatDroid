[package]
name = "emu_rust_host"
version = "0.1.0"
edition = "2021"
description = "Memory-safe plugin host, ABI validator, and lock-free HAL ring buffers for Android 15"

[lib]
name = "emu_rust_host"
crate-type = ["staticlib", "cdylib"]

[dependencies]
libc = "0.2"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
